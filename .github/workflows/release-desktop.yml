name: Release desktop (TTK Video Mixer)

# Builds the Windows installer and the macOS dmg from the SAME source, then
# publishes both to a GitHub Release for the pushed tag. The website's
# /download page and /api/download/[platform] resolve the latest stable
# release from this same repo (see website/src/lib/download.ts) — nothing
# there is hardcoded, so a tag pushed here is what actually goes live.
on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    # Default GITHUB_TOKEN is read-only in this repo/org; softprops/action-gh-release
    # needs contents:write to create the release and upload the installers.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run dist
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Uploads straight to the GitHub Release instead of an Actions artifact —
      # Release assets aren't billed against the Actions storage quota, which
      # is what blocked v1.4.0/v1.4.1 (90-day-default build artifacts from past
      # releases had piled up to ~11GB and hit the account's quota, and that
      # usage figure only recalculates every 6-12h even after deleting them).
      #
      # NOT softprops/action-gh-release: a one-shot upload with no retry has
      # failed outright on transient GitHub-side errors (a 500 page, "Error
      # saving asset", "Headers Timeout") on real release attempts — for
      # BOTH the small Windows files and the large macOS .dmg, so this isn't
      # only a large-file problem. `gh release upload` per file with a retry
      # loop survives that; `--clobber` makes re-running this step safe.
      - name: Publish GitHub Release (Windows assets)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          fi
          for f in release/TTK-Video-Mixer-Setup-*.exe release/TTK-Video-Mixer-Setup-*.exe.blockmap release/latest.yml; do
            echo "Uploading $f..."
            for attempt in 1 2 3 4 5; do
              if gh release upload "${{ github.ref_name }}" "$f" --clobber; then
                echo "Uploaded $f"
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "Failed to upload $f after 5 attempts"
                exit 1
              fi
              echo "Attempt $attempt failed, retrying in 15s..."
              sleep 15
            done
          done

  build-macos:
    needs: build-windows
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Unsigned build: no Apple Developer credentials are invented here.
      # Once real APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID or a
      # CSC_LINK certificate are added as repo secrets and wired into env
      # below, electron-builder picks them up automatically for signing and
      # notarization — see package.json build.mac config.
      - run: npm run dist:mac
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # needs: build-windows makes this run after the release already exists
      # (created above) instead of racing it — this just adds more files to
      # that same release. Same per-file retry approach as the Windows job
      # above (see its comment) — the macOS .dmg is also the largest single
      # asset either job uploads (~200MB+, bundles both x64 and arm64
      # Electron runtimes), so it's the one most exposed to a transient
      # upload hiccup turning into a fully failed job.
      - name: Publish GitHub Release (macOS assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in release/TTK-Video-Mixer-*.dmg release/TTK-Video-Mixer-*.zip release/latest-mac.yml; do
            echo "Uploading $f..."
            for attempt in 1 2 3 4 5; do
              if gh release upload "${{ github.ref_name }}" "$f" --clobber; then
                echo "Uploaded $f"
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "Failed to upload $f after 5 attempts"
                exit 1
              fi
              echo "Attempt $attempt failed, retrying in 15s..."
              sleep 15
            done
          done
